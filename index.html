<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deepwell</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app" class="biome-shallows">
      <header class="top-strip panel">
        <div>₵ <span id="currency">0</span></div>
        <div>Rod: <span id="rodName">Starter Reed</span></div>
        <div>Luck: <span id="luckValue">0</span>%</div>
        <div>Biome: <span id="biomeLabel">Shallows</span></div>
      </header>

      <main class="main-layout">
        <section class="water-shell panel" id="waterShell">
          <div class="depth-markings" id="depthMarks"></div>
          <div class="water-container" id="waterContainer">
            <div class="surface-ripple"></div>
            <div class="particles" id="particles"></div>
            <div class="control-zone" id="controlZone"></div>
            <div class="energy-line" id="energyLine"></div>
            <div class="fish-shadow" id="fishShadow"></div>
            <div class="hook-node" id="hookNode">
              <div class="tension-ring" id="tensionRing"></div>
            </div>
            <div class="water-vignette"></div>
            <div class="water-message" id="waterMessage">Hold inside the well to cast.</div>
          </div>
        </section>

        <aside class="side-panel panel">
          <section>
            <h3>Recent Catch</h3>
            <div id="recentCatch">Nothing yet.</div>
          </section>
          <section>
            <h3>Event Log</h3>
            <div id="eventLog" class="event-log"></div>
          </section>
        </aside>
      </main>

      <footer class="bottom-strip panel">
        <div id="stateText">Idle · Hold to Cast</div>
        <div class="sonar" id="sonar"></div>
      </footer>

      <button class="version-plate" id="versionPlate">v<span id="versionText"></span><span id="versionDot" class="dot hidden"></span></button>

      <div class="overlay" id="changelogOverlay">
        <div class="overlay-card panel">
          <div class="overlay-head">
            <h2>Changelog</h2>
            <button id="closeChangelog">Close</button>
          </div>
          <div class="tabs" id="changelogTabs"></div>
          <div id="changelogBody"></div>
          <div class="pager">
            <button id="prevPage">Prev</button>
            <span id="pageInfo">1/1</span>
            <button id="nextPage">Next</button>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
