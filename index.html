<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#05070b" />

  <title>Deepwell — Stay Tuned</title>

  <style>
    :root {
      --background: #05070b;
      --background-soft: #080c13;

      --text: #f4f7fb;
      --muted: #8994a5;

      --blue: #5f9cff;
      --blue-bright: #8bbaff;
      --purple: #8c72ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: var(--text);

      background:
        radial-gradient(
          circle at 50% 42%,
          rgba(65, 118, 210, 0.11),
          transparent 28rem
        ),
        radial-gradient(
          circle at 25% 20%,
          rgba(101, 77, 190, 0.07),
          transparent 26rem
        ),
        linear-gradient(
          180deg,
          var(--background-soft),
          var(--background)
        );
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.35;

      background-image:
        linear-gradient(
          rgba(255, 255, 255, 0.018) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.018) 1px,
          transparent 1px
        );

      background-size: 48px 48px;

      mask-image:
        radial-gradient(
          circle at center,
          black,
          transparent 75%
        );
    }

    .ambient {
      position: fixed;
      width: 34rem;
      height: 34rem;
      border-radius: 50%;
      filter: blur(110px);
      background: rgba(79, 133, 255, 0.12);
      animation: ambient 8s ease-in-out infinite;
    }

    main {
      position: relative;
      z-index: 1;
      width: min(950px, calc(100% - 40px));
      text-align: center;
    }

    .eyebrow {
      margin-bottom: 22px;
      font-size: 0.74rem;
      font-weight: 650;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--blue-bright);
      opacity: 0;
      transform: translateY(14px);
      animation: reveal 0.8s ease forwards 0.1s;
    }

    .hero-logo-wrap {
      position: relative;
      display: inline-block;
      padding: 12px;
      border-radius: 22px;

      background:
        linear-gradient(
          135deg,
          rgba(95, 156, 255, 0.55),
          rgba(140, 114, 255, 0.45)
        );

      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.05),
        0 0 30px rgba(95, 156, 255, 0.18),
        0 0 80px rgba(140, 114, 255, 0.12);

      opacity: 0;
      transform: translateY(14px);
      animation:
        reveal 1s cubic-bezier(.2,.8,.2,1) forwards 0.2s,
        breatheFrame 5s ease-in-out infinite 1.3s;
    }

    .hero-logo-wrap::before {
      content: "";
      position: absolute;
      inset: 1px;
      border-radius: 20px;
      pointer-events: none;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .hero-logo {
      display: block;
      width: min(1080px, 100%);
      height: auto;
      border-radius: 14px;
      background: #0a0f16;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.06),
        0 14px 40px rgba(0, 0, 0, 0.35);
    }

    .divider {
      width: 86px;
      height: 2px;
      margin: 34px auto;
      border-radius: 999px;

      background:
        linear-gradient(
          90deg,
          var(--blue),
          var(--purple)
        );

      box-shadow:
        0 0 18px rgba(93, 149, 255, 0.4);

      transform: scaleX(0);
      animation: grow 0.8s ease forwards 0.7s;
    }

    .message {
      font-size: clamp(1.05rem, 2vw, 1.35rem);
      line-height: 1.75;
      color: var(--muted);
      opacity: 0;
      transform: translateY(14px);
      animation: reveal 0.8s ease forwards 0.8s;
    }

    .message strong {
      color: #dce7f8;
      font-weight: 550;
    }

    .stay-tuned {
      display: inline-flex;
      align-items: center;
      position: relative;
      margin-top: 48px;
      padding: 14px 24px;
      border: 1px solid rgba(133, 170, 231, 0.18);
      border-radius: 999px;

      background:
        linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.055),
          rgba(255, 255, 255, 0.025)
        );

      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.055),
        0 10px 35px rgba(0, 0, 0, 0.18);

      backdrop-filter: blur(12px);

      color: #edf4ff;
      font-size: 0.83rem;
      font-weight: 650;
      letter-spacing: 0.16em;
      text-transform: uppercase;

      opacity: 0;
      transform: translateY(14px);

      animation:
        reveal 0.8s ease forwards 1.05s,
        breathe 4s ease-in-out infinite 2s;
    }

    .stay-tuned::before {
      content: "";
      width: 7px;
      height: 7px;
      margin-right: 12px;
      border-radius: 50%;
      background: var(--blue-bright);
      box-shadow:
        0 0 12px var(--blue),
        0 0 26px rgba(95, 156, 255, 0.55);
      animation: status 2.4s ease-in-out infinite;
    }

    footer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 26px;
      text-align: center;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      color: #4e5968;
      opacity: 0;
      transform: translateY(14px);
      animation: reveal 1s ease forwards 1.3s;
    }

    @keyframes reveal {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes grow {
      to {
        transform: scaleX(1);
      }
    }

    @keyframes ambient {
      0%, 100% {
        transform: scale(0.92);
        opacity: 0.55;
      }
      50% {
        transform: scale(1.08);
        opacity: 1;
      }
    }

    @keyframes breathe {
      0%, 100% {
        border-color: rgba(133, 170, 231, 0.16);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.055),
          0 10px 35px rgba(0, 0, 0, 0.18);
      }
      50% {
        border-color: rgba(133, 170, 231, 0.3);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.065),
          0 10px 45px rgba(58, 111, 211, 0.13);
      }
    }

    @keyframes breatheFrame {
      0%, 100% {
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.05),
          0 0 30px rgba(95, 156, 255, 0.18),
          0 0 80px rgba(140, 114, 255, 0.12);
      }
      50% {
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.07),
          0 0 42px rgba(95, 156, 255, 0.26),
          0 0 95px rgba(140, 114, 255, 0.18);
      }
    }

    @keyframes status {
      0%, 100% {
        opacity: 0.55;
        transform: scale(0.85);
      }
      50% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @media (max-width: 700px) {
      .hero-logo-wrap {
        padding: 9px;
        border-radius: 18px;
      }

      .hero-logo {
        border-radius: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

<body>
  <div class="ambient"></div>

  <main>
    <div class="eyebrow">Currently in development</div>

    <div class="hero-logo-wrap">
      <img
        class="hero-logo"
        src="deepwell-hero.png"
        alt="Deepwell"
        draggable="false"
      />
    </div>

    <div class="divider"></div>

    <p class="message">
      <strong>Completely rebuilding the game from scratch.</strong>
      <br />
      A new Deepwell is on the way.
    </p>

    <div class="stay-tuned">
      Stay Tuned
    </div>
  </main>

  <br>

  <footer>
    Repo of <a href="https://github.com/The-Unnamed-Official/Deepwell/tree/published" target="__blank">Deepwell</a>
  </footer>

  <br>

  <footer>
    Being developed by <a href="https://discord.com/users/611204110955446301" target="__blank">The Unnamed</a>
  </footer>
</body>
</html>
