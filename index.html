<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#05070b" />

  <title>Deepwell — Stay Tuned</title>

  <style>
    :root {
      --background: #05070b;
      --background-soft: #080c13;

      --text: #f4f7fb;
      --muted: #8994a5;

      --blue: #5f9cff;
      --blue-bright: #8bbaff;
      --purple: #8c72ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    html {
      background: var(--background);
    }

    html::-webkit-scrollbar,
    body::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;

      overflow-x: hidden;
      overflow-y: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: var(--text);

      background:
        radial-gradient(
          circle at 50% 42%,
          rgba(65, 118, 210, 0.11),
          transparent 28rem
        ),
        radial-gradient(
          circle at 25% 20%,
          rgba(101, 77, 190, 0.07),
          transparent 26rem
        ),
        linear-gradient(
          180deg,
          var(--background-soft),
          var(--background)
        );
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.35;

      background-image:
        linear-gradient(
          rgba(255, 255, 255, 0.018) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.018) 1px,
          transparent 1px
        );

      background-size: 48px 48px;

      mask-image:
        radial-gradient(
          circle at center,
          black,
          transparent 75%
        );
    }

    .ambient {
      position: fixed;
      top: 50%;
      left: 50%;

      width: min(34rem, 90vw);
      height: min(34rem, 90vw);

      border-radius: 50%;

      transform: translate(-50%, -50%);
      filter: blur(110px);

      background: rgba(79, 133, 255, 0.12);

      pointer-events: none;

      animation: ambient 8s ease-in-out infinite;
    }

    .page {
      position: relative;
      z-index: 1;

      width: 100%;

      min-height: 100vh;
      min-height: 100dvh;

      display: flex;
      flex-direction: column;
      align-items: center;
    }

    main {
      width: 100%;
      flex: 1;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      text-align: center;

      padding:
        clamp(16px, 2.5vh, 32px)
        16px
        clamp(18px, 3vh, 36px);
    }

    .content {
      width: 100%;

      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .eyebrow {
      margin-bottom: clamp(10px, 2vh, 22px);

      font-size: clamp(0.58rem, 1.5vw, 0.74rem);
      font-weight: 650;
      letter-spacing: 0.32em;
      text-transform: uppercase;

      color: var(--blue-bright);

      opacity: 0;
      transform: translateY(14px);

      animation: reveal 0.8s ease forwards 0.1s;
    }

    .hero-logo-wrap {
      position: relative;

      width: min(
        950px,
        calc(100vw - 32px),
        82dvh
      );

      padding: clamp(7px, 1.3vw, 12px);

      border-radius: clamp(15px, 2vw, 22px);

      background:
        linear-gradient(
          135deg,
          rgba(95, 156, 255, 0.55),
          rgba(140, 114, 255, 0.45)
        );

      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.05),
        0 0 30px rgba(95, 156, 255, 0.18),
        0 0 80px rgba(140, 114, 255, 0.12);

      opacity: 0;
      transform: translateY(14px);

      animation:
        reveal 1s cubic-bezier(.2, .8, .2, 1) forwards 0.2s,
        breatheFrame 5s ease-in-out infinite 1.3s;
    }

    .hero-logo-wrap::before {
      content: "";

      position: absolute;
      inset: 1px;

      border-radius: inherit;
      border: 1px solid rgba(255, 255, 255, 0.08);

      pointer-events: none;
    }

    .hero-logo {
      display: block;

      width: 100%;
      height: auto;

      border-radius: clamp(10px, 1.5vw, 14px);

      background: #0a0f16;

      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.06),
        0 14px 40px rgba(0, 0, 0, 0.35);
    }

    .divider {
      width: clamp(58px, 9vw, 86px);
      height: 2px;

      margin:
        clamp(17px, 3.2vh, 34px)
        auto
        clamp(16px, 3vh, 34px);

      border-radius: 999px;

      background:
        linear-gradient(
          90deg,
          var(--blue),
          var(--purple)
        );

      box-shadow:
        0 0 18px rgba(93, 149, 255, 0.4);

      transform: scaleX(0);

      animation: grow 0.8s ease forwards 0.7s;
    }

    .message {
      width: min(720px, calc(100vw - 36px));

      font-size: clamp(0.92rem, 2vw, 1.35rem);
      line-height: 1.65;

      color: var(--muted);

      opacity: 0;
      transform: translateY(14px);

      animation: reveal 0.8s ease forwards 0.8s;
    }

    .message strong {
      color: #dce7f8;
      font-weight: 550;
    }

    .message a {
      color: #6f7dff;
      text-decoration: none;
    }

    .message a:hover {
      color: var(--blue-bright);
    }

    .stay-tuned-wrap {
      margin-top: clamp(18px, 3.8vh, 42px);

      opacity: 0;
      transform: translateY(14px);

      animation: reveal 0.8s ease forwards 1.05s;
    }

    .stay-tuned {
      display: inline-flex;
      align-items: center;

      padding:
        clamp(9px, 1.5vh, 13px)
        clamp(17px, 3vw, 24px);

      border: 1px solid rgba(133, 170, 231, 0.18);
      border-radius: 999px;

      background:
        linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.055),
          rgba(255, 255, 255, 0.025)
        );

      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.055),
        0 10px 35px rgba(0, 0, 0, 0.18);

      backdrop-filter: blur(12px);

      color: #edf4ff;

      font-size: clamp(0.68rem, 1.4vw, 0.83rem);
      font-weight: 650;

      letter-spacing: 0.16em;
      text-transform: uppercase;

      animation: breathe 4s ease-in-out infinite 2s;
    }

    .stay-tuned::before {
      content: "";

      width: 7px;
      height: 7px;

      flex: 0 0 7px;

      margin-right: 12px;

      border-radius: 50%;

      background: var(--blue-bright);

      box-shadow:
        0 0 12px var(--blue),
        0 0 26px rgba(95, 156, 255, 0.55);

      animation: status 2.4s ease-in-out infinite;
    }

    .countdown {
      margin-top: clamp(9px, 1.6vh, 15px);

      color: #dce7f8;

      font-size: clamp(1.3rem, 4vw, 2rem);
      font-weight: 650;

      font-variant-numeric: tabular-nums;

      letter-spacing: 0.08em;

      line-height: 1.15;

      text-shadow:
        0 0 18px rgba(95, 156, 255, 0.22);
    }

    .countdown-label {
      margin-top: 5px;

      color: #59677a;

      font-size: clamp(0.52rem, 1.4vw, 0.62rem);
      font-weight: 650;

      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    footer {
      width: 100%;

      flex-shrink: 0;

      padding:
        clamp(10px, 1.8vh, 18px)
        16px
        clamp(12px, 2.3vh, 24px);

      text-align: center;

      font-size: clamp(0.62rem, 1.5vw, 0.72rem);
      letter-spacing: 0.08em;

      color: #4e5968;

      opacity: 0;
      transform: translateY(14px);

      animation: reveal 1s ease forwards 1.3s;
    }

    footer a {
      color: #745da8;
      text-decoration: none;
    }

    footer a:hover {
      color: var(--purple);
    }

    @keyframes reveal {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes grow {
      to {
        transform: scaleX(1);
      }
    }

    @keyframes ambient {
      0%,
      100% {
        transform:
          translate(-50%, -50%)
          scale(0.92);

        opacity: 0.55;
      }

      50% {
        transform:
          translate(-50%, -50%)
          scale(1.08);

        opacity: 1;
      }
    }

    @keyframes breathe {
      0%,
      100% {
        border-color: rgba(133, 170, 231, 0.16);

        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.055),
          0 10px 35px rgba(0, 0, 0, 0.18);
      }

      50% {
        border-color: rgba(133, 170, 231, 0.3);

        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.065),
          0 10px 45px rgba(58, 111, 211, 0.13);
      }
    }

    @keyframes breatheFrame {
      0%,
      100% {
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.05),
          0 0 30px rgba(95, 156, 255, 0.18),
          0 0 80px rgba(140, 114, 255, 0.12);
      }

      50% {
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.07),
          0 0 42px rgba(95, 156, 255, 0.26),
          0 0 95px rgba(140, 114, 255, 0.18);
      }
    }

    @keyframes status {
      0%,
      100% {
        opacity: 0.55;
        transform: scale(0.85);
      }

      50% {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* Tablets / smaller laptops */
    @media (max-width: 900px) {
      .hero-logo-wrap {
        width: min(
          calc(100vw - 28px),
          76dvh
        );
      }
    }

    /* Phones */
    @media (max-width: 600px) {
      main {
        padding-left: 12px;
        padding-right: 12px;
      }

      .hero-logo-wrap {
        width: min(
          calc(100vw - 24px),
          72dvh
        );

        padding: 7px;
        border-radius: 16px;
      }

      .hero-logo {
        border-radius: 10px;
      }

      .message {
        width: min(100%, 500px);
        line-height: 1.55;
      }

      .message br {
        display: none;
      }
    }

    /*
      Short screens:
      laptop windows, landscape tablets,
      phones turned sideways, etc.
    */
    @media (max-height: 760px) {
      main {
        padding-top: 10px;
        padding-bottom: 10px;
      }

      .eyebrow {
        margin-bottom: 9px;
      }

      .hero-logo-wrap {
        width: min(
          720px,
          calc(100vw - 28px),
          68dvh
        );
      }

      .divider {
        margin-top: 14px;
        margin-bottom: 14px;
      }

      .message {
        font-size: clamp(0.85rem, 1.8vw, 1.05rem);
        line-height: 1.45;
      }

      .stay-tuned-wrap {
        margin-top: 14px;
      }

      .stay-tuned {
        padding: 8px 17px;
      }

      .countdown {
        margin-top: 8px;
        font-size: clamp(1.15rem, 3.5vw, 1.55rem);
      }

      footer {
        padding-top: 7px;
        padding-bottom: 9px;
      }
    }

    /* Very short landscape screens */
    @media (max-height: 520px) {
      .hero-logo-wrap {
        width: min(
          520px,
          calc(100vw - 24px),
          58dvh
        );
      }

      .eyebrow {
        font-size: 0.52rem;
      }

      .divider {
        margin-top: 9px;
        margin-bottom: 9px;
      }

      .stay-tuned-wrap {
        margin-top: 9px;
      }

      footer {
        padding: 6px 12px 8px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

<body>
  <div class="ambient"></div>

  <div class="page">
    <main>
      <div class="content">
        <div class="eyebrow">
          Currently in development
        </div>

        <div class="hero-logo-wrap">
          <img
            class="hero-logo"
            src="deepwell-hero.png"
            alt="Deepwell"
            draggable="false"
          />
        </div>

        <div class="divider"></div>

        <p class="message">
          <strong>
            Completely rebuilding the game from scratch.
          </strong>

          <br />

          A new
          <a
            href="https://github.com/The-Unnamed-Official/Deepwell/tree/published"
            target="_blank"
            rel="noopener noreferrer"
          >
            Deepwell
          </a>
          is on the way.
        </p>

        <div class="stay-tuned-wrap">
          <div class="stay-tuned">
            Stay Tuned
          </div>

          <div
            class="countdown"
            id="countdown"
          >
            00:00:00
          </div>

          <div class="countdown-label">
            Until 7:45 PM CEST
          </div>
        </div>
      </div>
    </main>

    <footer>
      Being developed by
      <a
        href="https://discord.com/users/611204110955446301"
        target="_blank"
        rel="noopener noreferrer"
      >
        The Unnamed
      </a>
    </footer>
  </div>

  <script>
    const countdown = document.getElementById("countdown");

    // September 3, 2026 — 7:45 PM CEST (UTC+2)
    const targetTime =
      new Date("2026-09-03T19:45:00+02:00").getTime();

    let countdownInterval;

    function updateCountdown() {
      const remaining = targetTime - Date.now();

      if (remaining <= 0) {
        countdown.textContent = "00:00:00";

        if (countdownInterval) {
          clearInterval(countdownInterval);
        }

        return;
      }

      const totalSeconds =
        Math.floor(remaining / 1000);

      const hours =
        Math.floor(totalSeconds / 3600);

      const minutes =
        Math.floor(
          (totalSeconds % 3600) / 60
        );

      const seconds =
        totalSeconds % 60;

      countdown.textContent =
        String(hours).padStart(2, "0") +
        ":" +
        String(minutes).padStart(2, "0") +
        ":" +
        String(seconds).padStart(2, "0");
    }

    updateCountdown();

    countdownInterval =
      setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
