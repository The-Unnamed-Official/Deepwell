<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deepwell</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app" class="zone-shallows">
      <header class="topbar">
        <h1>Deepwell</h1>
        <div class="economy">
          <span id="currency">₵ 0</span>
          <button id="sellAllBtn" class="ghost">Sell Catch</button>
          <button id="changelogBtn" class="ghost">Changelog</button>
        </div>
      </header>

      <main class="main-layout">
        <section class="well-panel">
          <div class="well-view">
            <div class="depth-overlay"></div>
            <div class="depth-particles" id="depthParticles"></div>
            <div id="rodCharacter" class="rod-character"></div>
            <div class="line" id="line"></div>
            <div class="hook" id="hook"></div>
            <div class="splash" id="splash"></div>
            <div class="zone-label" id="zoneLabel">Shallows</div>
          </div>
          <div class="controls">
            <button id="castBtn" class="primary">Hold to Cast</button>
            <button id="reelBtn" class="secondary" disabled>Hook / Reel</button>
            <button id="openRodShopBtn" class="ghost">Rod Shop</button>
            <label class="check inline-check"><input type="checkbox" id="focusedModeToggle" /> Focused Reeling Mode (+15% value)</label>
          </div>
        </section>

        <aside class="hud">
          <div class="card depth-meter-card">
            <label>Depth</label>
            <div class="depth-meter">
              <div id="depthFill"></div>
            </div>
            <div class="depth-readout"><span id="depthValue">0m</span></div>
          </div>

          <div class="card phase-card">
            <label>Fishing Phase</label>
            <div id="phaseInfo">Hold cast to charge.</div>
            <div class="cast-meter" id="castMeter">
              <div id="castPowerFill"></div>
              <div id="castSweetSpot"></div>
              <div id="castMarker"></div>
            </div>
            <div id="castInfo" class="catch-sub">Release in the sweet spot for +2% cast luck.</div>
            <div class="bite-meter"><div id="biteWindowFill"></div></div>
            <div id="biteInfo" class="catch-sub">Wait for a bite cue.</div>
          </div>

          <div class="card minigame-card">
            <label>Tension Fight</label>
            <div class="tension-wrap" id="tensionWrap">
              <div class="tension-bar" id="tensionBar"></div>
              <div class="safe-zone" id="safeZone"></div>
              <div class="fish-indicator" id="fishIndicator"></div>
            </div>
            <div id="tensionInfo" class="catch-sub">Hook a fish to start.</div>
          </div>

          <div class="card">
            <label>Rod</label>
            <div id="rodInfo"></div>
          </div>

          <div class="card">
            <label>Luck</label>
            <div id="luckInfo">0</div>
          </div>

          <div class="card">
            <label>Biome</label>
            <div id="biomeInfo">Shallows</div>
          </div>

          <div class="card">
            <label>Caps</label>
            <div id="capsInfo"></div>
          </div>

          <div class="card">
            <label>Recent Catch</label>
            <div id="recentCatch">Nothing yet.</div>
          </div>

          <div class="card">
            <label>Global Rarity Table</label>
            <ul id="rarityList" class="rarity-list"></ul>
          </div>

          <div class="card">
            <label>Fish Dex Snapshot</label>
            <div id="dexInfo"></div>
          </div>

          <div class="card">
            <label>Stats</label>
            <ul id="stats"></ul>
          </div>

          <div class="card" id="eventCard">
            <label>Global Feed</label>
            <div id="eventInfo">No global alerts.</div>
          </div>
        </aside>
      </main>
    </div>

    <div id="changelogModal" class="modal">
      <div class="modal-content">
        <h2>Deepwell Update Notes</h2>
        <div id="changelogStatus" class="status-line"></div>
        <div id="changelogContainer" class="changelog-list"></div>
        <label class="check"><input type="checkbox" id="dontShowVersion" /> Don't show again for this version</label>
        <button id="closeChangelogBtn" class="primary">Close</button>
      </div>
    </div>

    <div id="rodModal" class="modal">
      <div class="modal-content">
        <h2>Rod Shop</h2>
        <div id="rodShopContent"></div>
        <div class="modal-actions">
          <button id="buyRodBtn" class="primary">Buy</button>
          <button id="closeRodShopBtn" class="ghost">Close</button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
